# maestro_py_utils/pyproject.toml
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paestro"
version = "1.7.0"
authors = [
  { name="Mario Fabre", email="admin@mariofabre.dev" },
]
description = "A collection of Python utilities for the Maestro platform."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
  "pytz>=2024.2",
  "pillow>=12.0.0",
  "pyOpenSSL>=25.0.0",
  "requests>=2.32.3",
  "paramiko>=3.4.0",
]

[project.urls]
Homepage = "https://github.com/mariotafner/paestro"

[tool.setuptools.package-data]
paestro = ["py.typed"]